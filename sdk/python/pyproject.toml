[project]
name = "aiwatcher-sdk"
version = "0.1.0"
description = "Publish agent-run telemetry to aiwatcher, and read its prompt registry."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# Two, and the split is the design. The **telemetry** half — `aiwatcher_sdk`
# itself, which is what an instrumented agent imports — reaches for neither:
# it is `urllib`, `json` and `dataclasses`, because a telemetry library that
# forces an httpx version on a process that already pinned one is a library
# people vendor around, and because it must never take an agent down.
#
# The **registry** clients are the opposite case and always were. They run in
# training jobs, deploy steps and CLIs rather than inside somebody's request
# path; every method raises, because reading the export a run is about to
# consume *is* the work; and hand-rolling connection reuse, a retry policy and
# `Retry-After` on top of `urllib` is how a client ends up with four copies of
# a bug. Importing them costs the dependency; importing `aiwatcher_sdk` does
# not.
dependencies = ["httpx>=0.28,<0.29", "tenacity>=9.1,<10"]

[project.optional-dependencies]
# The DeepEval bridge does not import deepeval — it reads the report
# structurally, so this extra exists for a caller that wants both installed by
# one name, not because the bridge needs it.
deepeval = ["deepeval>=4.1,<5"]
# `integrations.vision` turns an export's vector shapes into the grids a loss
# function reads. numpy is not optional to that work and Pillow is not optional
# to decoding a PNG, so unlike the deepeval extra this one is real: the module
# imports them lazily and says this line when they are missing.
vision = ["numpy>=1.26", "pillow>=10.0"]
# `serving.runtimes.onnx` is the second runtime profile. Like the vision extra
# this one is real — a graph cannot be read without an interpreter — and unlike
# it, the interpreter is a hundred-megabyte wheel, which is why it is an extra
# rather than a dependency of a library that gets imported into agent
# processes. A host that will never serve a graph registers no onnx loader and
# never imports this.
onnx = ["onnxruntime>=1.17", "numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/ai-spirit/aiwatcher"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiwatcher_sdk"]
# PEP 561. The package is `mypy --strict` clean, and without this marker every
# consumer sees `Any` — which makes the typing here decoration rather than a
# contract. It also means a consumer's `# type: ignore[import-untyped]` on an
# aiwatcher import becomes unused, which under their own `strict` is an error:
# the fix is to delete the comment.
artifacts = ["aiwatcher_sdk/py.typed"]

[dependency-groups]
# numpy and Pillow are here rather than left to the extra because the
# rasteriser is the one thing in this SDK that can be wrong without anything
# raising: a mask that is subtly misaligned trains a model that scores well and
# predicts nonsense. It gets tested, so the checker needs them.
dev = ["mypy>=1.18,<2", "pytest>=8.4,<9", "ruff>=0.16.5,<0.17", "numpy>=1.26", "pillow>=10.0"]

[tool.uv]
# `uv` reads this and refuses to run under an older one, which is what keeps a
# lock produced here resolvable everywhere else. Pinned to a minor range
# rather than exactly: uv moves quickly and a patch release is not a decision.
required-version = ">=0.12.7,<0.13"

[tool.ruff]
# The floor of `requires-python`, not the version this happens to be developed
# on: `UP` rewrites to syntax the oldest supported interpreter must accept.
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E",     # pycodestyle
  "F",     # pyflakes
  "I",     # import order
  "UP",    # pyupgrade
  "B",     # bugbear
  "C4",    # comprehensions
  "SIM",   # simplify
  "RUF",   # ruff's own
  "ASYNC",
  "PTH",   # pathlib over os.path
  "BLE",   # no bare `except Exception`
  "N",     # naming
  "S",     # bandit
]
# The same base set `planner` selects, deliberately: these two repositories are
# worked on together, and a lint that fires in one and not the other is a lint
# people learn to ignore. `D` is left out with them — the docstrings here say
# what a thing *is* rather than what it does, which pydocstyle's imperative
# mood check would turn into a file of "Return the version.".

[tool.ruff.lint.per-file-ignores]
# Tests assert, hard-code throwaway secrets, and bind to localhost.
"tests/*" = ["S101", "S105", "S106", "S104"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["aiwatcher_sdk", "tests"]

# onnxruntime is deliberately *not* a dev dependency. numpy and Pillow are,
# because the rasteriser can be wrong without anything raising and so has to be
# tested for real; the ONNX loader's gates are pure functions of what a session
# says about itself and are tested against a stub one, which is what keeps a
# hundred megabytes of runtime out of every CI run. The wheel ships no stubs
# either way, so this line would be here regardless.
# torch is not a dependency either, and for a larger version of the same
# reason: `ExportDataset.loader` imports it inside the one method that cannot
# work without it, and every other line of the rasteriser is numpy. A CI run
# that installed torch to check one `DataLoader(...)` call would be installing
# two gigabytes to type-check a constructor.
[[tool.mypy.overrides]]
module = ["onnxruntime", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
