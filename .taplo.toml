include = ["**/*.toml"]

# What `include` sweeps up that nobody here wrote. A `.venv` holds a vendored
# `pandas/pyproject.toml` formatted by whoever published pandas, and a
# `vendor/` holds somebody's PHP package — neither is this repository's to
# reformat, and both are ignored by git already. taplo does not read
# `.gitignore` when `include` is set, so the exclusion is stated here or the
# check passes in CI (a fresh checkout, no virtualenvs) and fails on every
# machine that has run `just sdk-install`.
#
# `.claude/worktrees` is the same problem with a sharper edge: each entry is a
# second checkout of this repository on somebody else's branch, so the files
# there are theirs and are quite reasonably mid-edit. Formatting them would
# rewrite another session's working tree, and checking them makes this repo's
# own check fail for work that is not in it.
exclude = [
  "**/.venv/**",
  "**/node_modules/**",
  "**/target/**",
  "**/vendor/**",
  "**/.claude/worktrees/**",
]

# Two settings carry this file, and both exist to agree with how the repository
# is already written rather than with taplo's defaults:
#
#   compact_arrays   omits the padding inside a single-line array, so a feature
#                    list reads ["ws", "macros"] and not [ "ws", "macros" ].
#                    It was false here, which is why every Cargo.toml in the
#                    workspace failed `taplo fmt --check`.
#   column_width     100, the `max_width` in rustfmt.toml. One width for the
#                    repository means a manifest wraps where its crate's source
#                    wraps.
[formatting]
align_entries = false
array_auto_expand = true
column_width = 100
compact_arrays = true
indent_string = "  "
reorder_keys = false
