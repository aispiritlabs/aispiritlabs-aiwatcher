name: CI

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A CI machine gains nothing from incremental compilation and pays for it in
  # cache size.
  CARGO_INCREMENTAL: '0'
  RUSTFLAGS: '-D warnings'

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the version, so fmt and clippy output here
      # matches what a developer sees locally.
      # rust-toolchain.toml pins 1.98.0; `@master` honours it rather than
      # pulling whatever `stable` happens to be that week.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -Dwarnings

      - name: cargo test
        run: cargo test --workspace --all-targets

      # The Laser adapter is feature-gated, so the default suite never compiles
      # it. Type-check it here so a change to the SDK's API is a red build
      # rather than a surprise the next time someone turns the feature on.
      - name: cargo clippy (laser feature)
        run: cargo clippy -p aiwatcher-bus -p aiwatcher-server --features aiwatcher-server/laser --all-targets -- -Dwarnings

  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3

      # The panel's TypeScript client is generated from this file. If it is
      # stale, the client and the routes have silently diverged — which is the
      # whole failure mode the codegen exists to prevent.
      - name: contract is current
        run: just openapi-check

  laser:
    name: Laser integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      iggy:
        image: apache/iggy:0.9.0-edge.5
        ports:
          - 8090:8090
        env:
          IGGY_TCP_ADDRESS: 0.0.0.0:8090
          # Without these two, 0.9.0-edge.5 generates a random root password and
          # logs it, so the connection string below is rejected with "Invalid
          # credentials". `just iggy-up` sets the same pair, for the same reason.
          IGGY_ROOT_USERNAME: iggy
          IGGY_ROOT_PASSWORD: iggy
        # Iggy's runtime is io_uring, which the default seccomp profile blocks.
        # A GitHub-hosted runner permits the NUMA memory binding that Docker
        # Desktop's VM does not, which is why this suite runs here and is
        # `#[ignore]`d locally.
        options: >-
          --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
      - uses: Swatinem/rust-cache@v2

      - name: wait for the broker
        run: |
          for _ in $(seq 1 60); do
            if nc -z 127.0.0.1 8090; then echo "iggy is up"; exit 0; fi
            sleep 1
          done
          echo "iggy never came up" >&2
          exit 1

      - name: laser integration tests
        env:
          AIWATCHER_LASER_CONNECTION_STRING: iggy:iggy@127.0.0.1:8090
        run: |
          cargo test -p aiwatcher-bus --features laser --test laser_integration \
            -- --ignored --test-threads=1

  workflow-store:
    name: Workflow store (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # The adapter a deployment uses, and the one the default suite never
      # touches: `cargo test --workspace` runs the storage contract against
      # `memory` and `file` only, because `postgres` is behind a feature so
      # `sqlx` stays out of every build that does not ask for it. Without this
      # job the eighteen properties prove nothing about the store that holds
      # production, and a migration is applied for the first time in a cluster.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aiwatcher
          POSTGRES_PASSWORD: aiwatcher
          POSTGRES_DB: aiwatcher
        # 5433, matching `just postgres-up`, so the connection string in the
        # recipe and the one here are the same string. That port was chosen so
        # a suite never lands in a project database somebody already has on
        # 5432; keeping it here means a failure reproduces locally verbatim.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aiwatcher"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3

      # The same suite the other two adapters pass, plus what is true of this
      # one alone: two replicas racing for a claim, a takeover after a worker
      # died, and applying the schema twice.
      - name: storage contract against a real database
        run: just test-postgres

  flow:
    name: Flow query service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          # The floor `composer.json` declares. Testing on it rather than on
          # the newest means a syntax somebody's 8.5 accepts does not ship
          # broken to an 8.3.
          php-version: '8.3'
          coverage: none
      - uses: extractions/setup-just@v3

      - name: install
        run: just flow-install

      # `just check` covers neither optional service, deliberately: PHP may not
      # be installed on a machine that only touches the Rust crates. That was a
      # statement about a *developer's* laptop and it was never one about CI —
      # a managed `flow_php` step runs through this service, so a break here is
      # a break in the execution path.
      - name: format, lint, tests
        run: just flow-check

  notebooks:
    name: Notebook runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Pinned exactly, for the reason the SDK job records: setup-uv stopped
      # publishing major tags, so a floating `@v10` would not resolve.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.7'
          enable-cache: true
          cache-dependency-glob: services/ml_pipeline/uv.lock
      - uses: extractions/setup-just@v3

      # The other half of the same argument: a managed `marimo` step runs
      # through this service. `uv` reads the Python version this project pins,
      # so nothing here names one.
      - name: ruff, mypy and pytest
        run: just ml-pipeline-check

  k8s:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3

      # kubeconform validates against published JSON schemas instead of an
      # apiserver's OpenAPI document, which is what lets this job render and
      # check both overlays on a runner with no cluster in it.
      - name: install kubeconform
        run: |
          curl -sSfL \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: manifests are valid
        run: just k8s-validate

  panel:
    name: Panel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json

      # --ignore-scripts for the same reason as deploy/Dockerfile.panel:
      # npm 11 skips unapproved dependency install scripts and warns, and the
      # only one here is esbuild's, which the build does not need.
      - name: install
        run: npm ci --ignore-scripts
        working-directory: apps/panel

      # `npm run build` is vite build followed by a full tsc project check, so
      # a type error in the panel fails here.
      - name: build and typecheck
        run: npm run build
        working-directory: apps/panel

      - name: generated client matches the contract
        working-directory: apps/panel
        run: |
          npm run generate:api
          if ! git diff --quiet -- src/api/generated; then
            echo "✗ src/api/generated is stale — run 'make openapi' and commit the result"
            git diff --stat -- src/api/generated
            exit 1
          fi

  sdks:
    name: SDKs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # No `setup-python`: uv installs the interpreter, and `--python 3.11`
      # below runs the suite on the floor `requires-python` claims rather than
      # on whatever the runner ships.
      # Pinned to an exact version, not a floating major: setup-uv stopped
      # publishing `v8`+ major tags, so `@v10` would not resolve.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.7'
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock

      - name: typescript sdk typecheck
        working-directory: sdk/typescript
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit

      - name: python sdk
        working-directory: sdk/python
        run: |
          uv sync --all-groups --frozen --python 3.11
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy .
          uv run pytest -q

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: typos-cli,taplo-cli,cargo-deny

      - name: typos
        run: typos

      - name: toml formatting
        run: taplo fmt --check

      # Licences and advisories. A dependency that changes licence is easier to
      # deal with the day it lands than a year later.
      - name: cargo deny
        run: cargo deny check
