# Builds the three runtime images on every push to main. Pull requests,
# merge queues and manual CI runs never publish packages.
name: Release images

on:
  push:
    branches: [main]

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PLATFORM: linux/amd64

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image names and immutable tag
        id: meta
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          {
            printf 'tag=%s\n' "$GITHUB_SHA"
            printf 'server=%s/%s/aiwatcher\n' "$REGISTRY" "$owner"
            printf 'panel=%s/%s/aiwatcher-panel\n' "$REGISTRY" "$owner"
            printf 'flow=%s/%s/aiwatcher-flow\n' "$REGISTRY" "$owner"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: aiwatcher server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.server }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: aiwatcher panel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.panel
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.panel }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=panel
          cache-to: type=gha,scope=panel,mode=max

      # The optional query service. Published unconditionally even though the
      # chart leaves it off (`flow.enabled`): a deployment that turns it on
      # should not need a build first, and the image is only pulled where it is.
      - name: aiwatcher flow
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.flow
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.flow }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=flow
          cache-to: type=gha,scope=flow,mode=max

      - name: Deployment values
        run: |
          {
            printf '## Published images\n\n'
            printf '```env\n'
            printf 'AIWATCHER_IMAGE=%s\n' '${{ steps.meta.outputs.server }}'
            printf 'AIWATCHER_PANEL_IMAGE=%s\n' '${{ steps.meta.outputs.panel }}'
            printf 'AIWATCHER_FLOW_IMAGE=%s\n' '${{ steps.meta.outputs.flow }}'
            printf 'AIWATCHER_IMAGE_TAG=%s\n' '${{ steps.meta.outputs.tag }}'
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
