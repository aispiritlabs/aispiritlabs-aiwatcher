# Builds the three runtime images on every push to main. Pull requests,
# merge queues and manual CI runs never publish packages.
name: Release images

on:
  push:
    branches: [main]

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PLATFORM: linux/amd64

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image names and immutable tag
        id: meta
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          {
            printf 'tag=%s\n' "$GITHUB_SHA"
            printf 'server=%s/%s/aiwatcher\n' "$REGISTRY" "$owner"
            printf 'panel=%s/%s/aiwatcher-panel\n' "$REGISTRY" "$owner"
            printf 'flow=%s/%s/aiwatcher-flow\n' "$REGISTRY" "$owner"
            printf 'datafusion=%s/%s/aiwatcher-query-datafusion\n' "$REGISTRY" "$owner"
            printf 'duckdb=%s/%s/aiwatcher-query-duckdb\n' "$REGISTRY" "$owner"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: aiwatcher server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          # A released image has to be able to do everything the chart's schema
          # admits. `values.schema.json` accepts `server.bus: laser` and
          # `execution.store: postgres`, and both are behind cargo features that
          # are off by default — deliberately, so a plain `cargo build` needs
          # neither a broker nor sqlx. That default is right for a build and
          # wrong for this one: without them the chart renders a value the
          # binary refuses at start-up, and the pod crash-loops naming the
          # feature. Which is exactly what a planner install did.
          #
          # The rule, not the instance: when the schema gains a backend behind a
          # feature, it goes here in the same change.
          build-args: |
            FEATURES=aiwatcher-server/postgres,aiwatcher-server/laser
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.server }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: aiwatcher panel
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.panel
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.panel }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=panel
          cache-to: type=gha,scope=panel,mode=max

      # The optional query engine. Published unconditionally even though the
      # chart leaves it off (`query.enabled`): a deployment that turns it on
      # should not need a build first, and the image is only pulled where it is.
      # One Dockerfile, a target per engine (AW-3).
      - name: aiwatcher flow
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.query
          target: flow
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.flow }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=flow
          cache-to: type=gha,scope=flow,mode=max

      - name: aiwatcher query (DataFusion)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.query
          target: datafusion
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.datafusion }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=datafusion
          cache-to: type=gha,scope=datafusion,mode=max

      - name: aiwatcher query (DuckDB)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.query
          target: duckdb
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.duckdb }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=duckdb
          cache-to: type=gha,scope=duckdb,mode=max

      - name: Deployment values
        run: |
          {
            printf '## Published images\n\n'
            printf '```env\n'
            printf 'AIWATCHER_IMAGE=%s\n' '${{ steps.meta.outputs.server }}'
            printf 'AIWATCHER_PANEL_IMAGE=%s\n' '${{ steps.meta.outputs.panel }}'
            printf '# one query image, for the engine AIWATCHER_QUERY_ENGINE names:\n'
            printf 'AIWATCHER_QUERY_IMAGE=%s\n' '${{ steps.meta.outputs.flow }}'
            printf '# AIWATCHER_QUERY_IMAGE=%s  (AIWATCHER_QUERY_ENGINE=datafusion)\n' '${{ steps.meta.outputs.datafusion }}'
            printf '# AIWATCHER_QUERY_IMAGE=%s  (AIWATCHER_QUERY_ENGINE=duckdb)\n' '${{ steps.meta.outputs.duckdb }}'
            printf 'AIWATCHER_IMAGE_TAG=%s\n' '${{ steps.meta.outputs.tag }}'
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
