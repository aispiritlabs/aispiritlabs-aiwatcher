# aiwatcher — default values.
#
# The defaults install a complete, self-contained stack: the server, the panel,
# an OpenTelemetry Collector, VictoriaTraces and VictoriaMetrics. That is the
# right shape for an empty namespace and the wrong shape for a cluster that
# already runs half of it, which is what `deploy/helmfile.yaml` is for — it
# looks at the cluster first and flips the `mode` fields below to `external`
# for everything it finds.
#
# Every backend is a three-way `mode`, never a boolean:
#
#   install    this release owns it
#   external   something else owns it; point at that instead
#   none       this deployment does without it, deliberately
#
# A boolean cannot tell "do not install it, it already exists" apart from "do
# not install it, we do not want it", and those need different wiring.

nameOverride: ""
# Resource names are `aiwatcher-*` rather than `<release>-*`; see _helpers.tpl.
fullnameOverride: aiwatcher

image:
  repository: ghcr.io/example/aiwatcher
  # Empty means .Chart.AppVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ── Server ───────────────────────────────────────────────────────────────────
#
# The projector and the API in one process. They are separate crates and could
# be separate Deployments, but splitting them turns the live hub from an
# in-process channel into another network hop (ADR_0004).
#
# There is deliberately no `replicas` here. A second replica would get its own
# live hub and its own read model, so which one a browser reached would decide
# what it saw; and two projectors in one consumer group would both consume
# during a rollout, with the one being torn down committing offsets for events
# the new one never saw. The Deployment is `replicas: 1`, `strategy: Recreate`.
server:
  # memory | wal | laser. `wal` is an append-only file on the volume below:
  # durable, single node, no broker. `laser` needs an image built with the
  # `laser` cargo feature — a default image will refuse to start on it.
  bus: wal

  # POST /api/v1/events. On, because it is how an SDK that cannot reach the
  # broker publishes — which is the whole integration path for a Python or
  # TypeScript agent. Turn it off where every producer writes to Laser directly.
  ingestEnabled: true

  # Reported as service.name on every exported span.
  serviceName: aiwatcher
  processorId: aiwatcher-projector

  logLevel: "info,aiwatcher=warn"
  # json | pretty
  logFormat: json

  # The read model's caps. These and the memory limit below are one decision:
  # `max_runs x max_spans_per_run` is not a bound, `maxSpansTotal` is. Raising
  # either without raising the limit risks an OOMKill; raising the limit alone
  # just leaves headroom unused. Re-run `just load-test` after changing them.
  maxRuns: 5000
  maxSpansTotal: 60000

  # How long a span with no end event waits before it is closed as orphaned.
  orphanTimeoutSeconds: 900

  # Only needed when the panel is served from a different origin than the API.
  # The bundled panel proxies /api, so same-origin, so this stays empty.
  corsOrigins: []

  # Used only when collector.mode is "none": the OTLP base URL the server posts
  # to itself. The server appends /v1/traces and /v1/metrics.
  otlpEndpoint: ""

  persistence:
    # The write-ahead log and the dead-letter queue. With `bus: memory` this can
    # be false; with `bus: wal` and false, a restart starts from an empty log —
    # fine for a test stack, data loss anywhere else.
    enabled: true
    size: 10Gi
    storageClassName: ""

  # Set when bus is "laser". The connection string is `user:pass@host:port`, so
  # it comes from a Secret rather than from values.
  laser:
    connectionStringSecret:
      name: ""
      key: AIWATCHER_LASER_CONNECTION_STRING
    stream: aiwatcher
    topic: events
    # Partition count is not configurable on purpose: the checkpoint is a
    # scalar, which has no total order across partitions, so more than one
    # would silently skip events on live-stream resume.

  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      memory: 512Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Single sign-on ───────────────────────────────────────────────────────────
#
# Off by default, like everything else that changes who can reach what. An
# installation that upgrades into a release which started refusing requests is
# an installation whose observability went away at the moment it was needed.
#
# Three modes, and the middle one is why the other two are not enough:
#
#   none    nobody is identified; every role check passes. The default.
#   oidc    aiwatcher runs the login itself, against authentik. Works anywhere,
#           needs an application in authentik, and is the only mode where the
#           identity is proved to *this* process rather than asserted to it.
#   proxy   an authenticating proxy already in front of aiwatcher puts the
#           identity in headers. One line to adopt where that proxy exists —
#           environments/planner.yaml is exactly that case — and it trusts the
#           network: any pod that can reach port 8080 can claim to be anybody.
#           Hence the NetworkPolicy requirement below.
#
# See docs/ADR/ADR_0013_SINGLE_SIGN_ON.md.
auth:
  mode: none

  # What the sign-in button says.
  providerName: authentik

  oidc:
    # authentik's issuer is `https://<host>/application/o/<application-slug>/`
    # — the *application* slug, not the provider name. The single most common
    # thing to get wrong here, and the symptom is a 404 on discovery.
    issuer: ""
    clientId: aiwatcher

    # The client secret and the session signing key. Both are passwords, so
    # they come from a Secret rather than from values — the same rule the Laser
    # connection string follows.
    #
    #   kubectl create secret generic aiwatcher-auth     #     --from-literal=AIWATCHER_AUTH_CLIENT_SECRET=...     #     --from-literal=AIWATCHER_AUTH_SESSION_SECRET="$(openssl rand -hex 32)"
    #
    # Without the session key the server generates one at start-up, which is
    # safe and signs everybody out on every restart.
    secret:
      name: ""
      clientSecretKey: AIWATCHER_AUTH_CLIENT_SECRET
      sessionSecretKey: AIWATCHER_AUTH_SESSION_SECRET

    # Derived from ingress.host when empty. Must match the redirect URI on the
    # authentik application exactly; set it by hand only for a host this chart
    # does not publish.
    redirectUrl: ""
    # Where to land after signing out. Empty leaves the browser on authentik's
    # own signed-out page.
    postLogoutUrl: ""

    scopes: [openid, profile, email]
    # authentik puts group names here under its default profile scope mapping.
    groupsClaim: groups
    # Eight hours. This is also the revocation window: sessions are signed
    # cookies with no server-side store, so signing out clears the browser's
    # copy and cannot invalidate one somebody took.
    sessionTtlSeconds: 28800

  # Which authentik groups mean which role. Create them in authentik — the
  # blueprint under deploy/authentik does — and put people in them there;
  # nothing about membership is configured here.
  roles:
    adminGroups: [aiwatcher-admins]
    editorGroups: [aiwatcher-editors]
    viewerGroups: [aiwatcher-viewers]
    # When non-empty, somebody in none of these is refused outright. The "who
    # may sign in at all" switch, separate from "what may they do".
    requiredGroups: []
    # What an authenticated user in none of the mapped groups gets. `viewer`
    # says the provider letting them in was the decision; `none` says a group
    # is required to see anything.
    defaultRole: viewer

  # How a producer authenticates.
  #
  # Not a shortcut around the provider — the thing the provider cannot do. An
  # agent posting to /api/v1/events runs in the cluster, reaches the Service
  # directly, never passes the ingress that authenticates a browser, and cannot
  # complete an interactive sign-in. Without this, turning `mode` on would
  # silently stop every SDK that publishes over HTTP.
  #
  # The Secret holds `name=secret` pairs, comma-separated. Each grants the
  # editor role and never admin: a secret in an agent's environment must not be
  # able to ask an orchestrator to run something.
  #
  #   kubectl create secret generic aiwatcher-ingest   #     --from-literal=AIWATCHER_AUTH_INGEST_TOKENS="planner=$(openssl rand -hex 32)"
  ingestTokenSecret:
    name: ""
    key: AIWATCHER_AUTH_INGEST_TOKENS

# ── Panel ────────────────────────────────────────────────────────────────────
#
# nginx serving the built React app and proxying /api to the server, so the
# browser talks to one origin and SSE and WebSocket need no CORS at all.
panel:
  enabled: true

  image:
    repository: ghcr.io/example/aiwatcher-panel
    tag: ""
    pullPolicy: IfNotPresent

  # Where nginx proxies the query engine's `/query/`. Leave it empty and set
  # `query.enabled` below to run the engine in this release — the upstream is
  # then this release's own Service. This field is for the other case: an engine
  # that already runs somewhere this chart does not manage. It wins over
  # `query.enabled` when both are set.
  #
  # Empty with no engine enabled means nginx answers 503 there, which the Query
  # tab reads as "the engine is not running" rather than as a failed query.
  queryUpstream: ""

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

# ── Query engine ─────────────────────────────────────────────────────────────
#
# The engine behind the panel's Query tab, its recipes and its curation
# transforms, and what a managed query step runs against (services/query,
# ADR_0008, AW-3). One per release: `engine` is `flow` (Flow PHP, the default),
# `datafusion` or `duckdb`, and switching is this one value — the server's
# AIWATCHER_QUERY_ENGINE follows it, so a plan written for another engine is
# refused when it is started rather than left for nothing to claim.
#
# Off by default, and separate from the binary on purpose: aiwatcher has no idea
# it exists, so a deployment without it answers 503 on /query — which that tab
# reads as "the engine is not running" — while every other view is unaffected.
#
# No engine has authentication of its own. So the panel's nginx and the server's
# reactor are the only things that reach it: the Service is ClusterIP, it gets
# no ingress path, and with networkPolicy.enabled those two are the pods let in
# — and the server is the only place it may reach, because a DataFusion or
# DuckDB query under `open` admission is Python that runs.
query:
  enabled: false

  # flow | datafusion | duckdb
  engine: flow

  # open | strict, read by the two Python engines. `open` runs a query the way a
  # notebook runs, in a child process with ceilings and no credentials; `strict`
  # admits only the engine's own vocabulary before anything runs. Flow is always
  # parsed rather than executed, and reads neither.
  admission: open

  # The engine's own ceiling on one query, in seconds (AIWATCHER_QUERY_TIMEOUT_SECONDS),
  # read by every engine. 0 derives it: with managed execution on, a minute above
  # `execution.queryStepTimeoutSeconds`, so a long step is stopped by the step's
  # clock and retried rather than refused by the engine; with it off, the
  # engine's own default of 30, which is what a person at the Query tab waits on.
  timeoutSeconds: 0

  images:
    flow:
      repository: ghcr.io/example/aiwatcher-flow
      # Empty means .Chart.AppVersion.
      tag: ""
      pullPolicy: IfNotPresent
    datafusion:
      repository: ghcr.io/example/aiwatcher-query-datafusion
      tag: ""
      pullPolicy: IfNotPresent
    duckdb:
      repository: ghcr.io/example/aiwatcher-query-duckdb
      tag: ""
      pullPolicy: IfNotPresent

  # A second replica would work — no engine keeps anything between requests —
  # but this backs a tab a person opens now and then, and each replica is a
  # runtime sitting idle the rest of the time.
  replicas: 1

  # Per engine, because what a query costs is the engine's. Flow: ADR_0008
  # measured 17 MB peak and ~210 ms, and its limit is headroom for the 1000-row
  # ceiling. DataFusion and DuckDB: measured over a 5 GB corpus at 280 MiB and
  # 677 MiB peak (benchmarks/curation), and AW-3 holds that neither passes
  # 1 GiB — so that is their limit.
  resources:
    flow:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { memory: 384Mi }
    datafusion:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }
    duckdb:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }

  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Managed execution ────────────────────────────────────────────────────────
#
# ADR_0025 and ADR_0026. A curation pipeline or a workflow started here is owned
# by the server: it compiles to an immutable plan, the decider schedules it, a
# reactor runs each step, and the facts go onto the event log like any other
# producer's. The browser asks for a run and may then close.
#
# Off by default, and that is the same decision as everywhere else in this
# chart: with `store: none` the `/api/v1/executions` routes answer 501 naming
# the variable, and the panel's Pipeline view still runs a chain from the
# browser, which is what it did before this existed and what an editor wants
# anyway.
execution:
  # none | file | postgres
  #
  # `file` holds ONE PROCESS — it takes a lock at start-up and refuses a second
  # by name. That is fine for a single replica and it is not a production
  # store: nothing about it is safe once this release runs the API and the
  # worker as two pods, which is why it refuses rather than interleaves.
  # `postgres` is what a deployment uses.
  store: none

  # How long a finished execution's history is kept. 0 keeps it forever, which
  # is the default.
  #
  # This is the *explanation* of a run — the commands, the decisions, the
  # attempt that failed and the one that did not — and it is the one thing the
  # event log does not carry, so a release that started deleting it on an
  # upgrade would be deleting the only copy. Set it deliberately, and set it
  # longer than the event log's retention: the log is what redelivers a message,
  # and the inbox that recognises a redelivery goes with the stream.
  retentionDays: 0

  # What an answer to a parked step may be.
  #
  # A step that stops to ask is resumed by a *new* attempt which re-runs the
  # work and reads every answer given so far, so they accumulate and nothing
  # takes any away. An agent approving each tool call adds one per turn.
  #
  # `maxAnswersPerStep` is the ceiling; 0 means none, which is a deployment
  # saying so rather than a default nobody chose. The point of a ceiling is not
  # the disk — it is that a task looping on its own question is stopped while
  # the refusal can still name what is wrong, instead of surfacing later as the
  # store refusing a message that has grown too large.
  #
  # `maxAnswerBytes` bounds one answer. An answer is a decision, not data: rows
  # reach a step as an artifact.
  maxAnswersPerStep: 256
  maxAnswerBytes: 65536

  # Where a query step runs: the engine `query.engine` names. Empty derives it
  # from `query.enabled`, the same way the panel's upstream is derived; set it
  # when the engine runs somewhere this chart does not manage.
  #
  # A process with no address here registers no query executor and therefore
  # claims no query attempt — absence is a working state, not a failure.
  queryUrl: ""

  # How long a managed query step may run, whichever engine runs it
  # (AIWATCHER_QUERY_STEP_TIMEOUT_SECONDS). A corpus read on disk is minutes, so
  # a deployment reading one raises this; the engine's ceiling follows it unless
  # `query.timeoutSeconds` says otherwise.
  queryStepTimeoutSeconds: 300

  # Whether to run the API and the worker as two Deployments (section 27).
  #
  # Off is not a lesser configuration — `both` is one process holding both
  # halves, and it is what `just run` and every development install are. The
  # split buys one thing: only the worker opens a socket to Flow, a notebook
  # runtime or an orchestrator, so the pod holding the ingress holds none of
  # those credentials.
  #
  # It costs three shared backends, because that is exactly what stops being
  # per-process when the binary is two processes: the workflow store, the log
  # the outbox publishes to and the projector folds, and the object store one
  # role writes a step's result into for the other to read. The chart refuses
  # each by name, as the server does — two of the three fail silently and the
  # third fails three attempts later with "holds no object".
  splitRoles: false

  # How many workers. More than one is fine and is the reason the split exists:
  # an attempt is claimed by exactly one of them, under a lease.
  workers: 1

  # Where a `marimo` notebook step runs (services/ml_pipeline). No default and
  # no template: that service runs notebook code with no sandbox and no
  # authentication, so it is a development surface bound to localhost. A cluster
  # that wants notebook blocks has to say where one is, deliberately.
  mlPipelineUrl: ""

  # Steps that run in a pod of their own (ADR_0029). No templates is the
  # default and means none: a step naming one is refused when it is registered.
  # Needs `store: postgres`, because a pod is a second process claiming its
  # attempt against the same store.
  pods:
    # A step's pod is a Job in this cluster, and this chart offers no other
    # backend on purpose. `AIWATCHER_POD_RUNTIME=docker` runs each attempt as a
    # container on the host the work role is on, and `=process` as a bare
    # process with no image and no limit (ADR_0029, amended): development
    # answers for a machine with no cluster, and in a cluster either would be
    # step code running beside the API, with this pod's service account.
    #
    # One per name, the operator's; no route writes one. Each lists the images
    # it runs (repositories, matched exactly and never by prefix — the step
    # names the tag), default resources and a required ceiling, the command its
    # container runs, and a pod-spec fragment written in full: volumes, env
    # from secrets, a service account, node selectors, tolerations. The server
    # refuses at start a template that sets what aiwatcher fills in — the
    # container's image, resources, command, args and three AIWATCHER_*
    # variables, and the pod's restartPolicy and deadline — and one whose
    # quantities are not strings, so quote `"1"`.
    #
    # Give each template a queue of its own and a token scoped to it
    # (`name[queue]=secret` in auth.ingestTokenSecret), and hand the pod that
    # token as AIWATCHER_TOKEN. Every pod of one template shares it.
    #
    # templates:
    #   planner-import:
    #     images: [ghcr.io/planner/import]
    #     resources:
    #       requests: { cpu: 500m, memory: 1Gi }
    #       limits: { cpu: "1", memory: 2Gi }
    #       max: { cpu: "4", memory: 8Gi }
    #     command: [python, -m, aiwatcher_sdk.worker, run-attempt,
    #               --queue, planner-import, --task, app.pipeline.stages:acquire]
    #     start_allowance_seconds: 300
    #     pod:
    #       containers:
    #         - name: stage
    #           env:
    #             - name: AIWATCHER_TOKEN
    #               valueFrom:
    #                 secretKeyRef: { name: planner-import-token, key: token }
    templates: {}
    # Where launched pods run. Empty is the release's namespace. Another one
    # gets the launcher's Role and RoleBinding written into it.
    namespace: ""

# ── PostgreSQL ───────────────────────────────────────────────────────────────
#
# The workflow store, and nothing else in this chart uses it. Read only when
# `execution.store` is "postgres".
#
# `install | external | none`, like every other backend here (ADR_0009): a
# second database beside an existing one is not a harmless duplicate, and the
# helmfile's detection reports one it finds rather than assuming.
postgresql:
  # install | external | none
  mode: none

  database: aiwatcher
  username: aiwatcher

  # Where the password comes from. With `mode: install` and no name, the chart
  # generates one on first install and reuses it on every upgrade — the same
  # `lookup` the object store's credentials use, and for the same reason: a new
  # password on every upgrade is a pod that cannot open the volume it wrote.
  # With `mode: external` this is required.
  credentialsSecret:
    name: ""
    passwordKey: password

  external:
    host: ""
    port: 5432
    # Filled in by the detection script. Used only by the NetworkPolicy below,
    # to add an ingress rule to pods this chart does not own — the same
    # mechanism the Collector uses to reach a fenced VictoriaMetrics.
    podSelector: {}
    namespace: ""

  image:
    repository: postgres
    tag: "17.6-alpine"
    pullPolicy: IfNotPresent

  # How many connections the server opens. Each replica holds this many idle,
  # and PostgreSQL's own default ceiling is 100.
  maxConnections: 5

  persistence:
    # On by default, like the object store's and unlike the trace store's. A
    # lost span is in VictoriaTraces; a lost execution stream is the only record
    # of why a run did what it did.
    enabled: true
    size: 5Gi
    storageClassName: ""

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# ── Collector ────────────────────────────────────────────────────────────────
#
# In the path even though the server can post OTLP straight at a store: it is
# where sampling, redaction and a second destination live, and having it here
# from the start makes those a ConfigMap edit rather than a redeploy.
collector:
  # install | external | none.
  #
  # The helmfile does NOT flip this to "external" when it finds a Collector in
  # the cluster, and that is on purpose: a foreign Collector almost certainly
  # has neither the VictoriaTraces exporter nor the redaction processor below.
  # Reusing one is a decision with a blast radius, so it stays explicit.
  mode: install

  external:
    # OTLP base URL, no /v1 suffix — the server appends the signal.
    endpoint: ""

  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.121.0
    pullPolicy: IfNotPresent

  # Drops gen_ai.prompt / completion / input.messages / output.messages before
  # anything is exported. Turning this off is a decision that needs a retention
  # policy and an access story attached, not a config tweak — which is why it
  # is one flag here rather than a per-SDK setting.
  redactPrompts: true

  # Written to every span as deployment.environment.
  environment: production

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# ── VictoriaTraces ───────────────────────────────────────────────────────────
#
# Where finished spans go. The only store that takes OTLP natively and answers
# the Jaeger query API, which is what lets Perses read it with no plugin
# (ADR_0005).
victoriatraces:
  # install | external | none
  mode: install

  external:
    # Base URL of an existing VictoriaTraces, e.g.
    # http://victoriatraces.observability.svc.cluster.local:10428
    url: ""

  image:
    repository: victoriametrics/victoria-traces
    tag: v0.11.0
    pullPolicy: IfNotPresent

  retentionPeriod: 30d

  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# ── VictoriaMetrics ──────────────────────────────────────────────────────────
#
# Where the aggregates go. Most clusters that would install aiwatcher already
# have one — the helmfile finds it and sets mode to "external".
victoriametrics:
  # install | external | none
  mode: install

  external:
    url: ""
    # Filled in by the detection script. Used only by the NetworkPolicy below,
    # to add an ingress rule to pods this chart does not own.
    podSelector: {}
    namespace: ""

  image:
    repository: victoriametrics/victoria-metrics
    tag: v1.150.0
    pullPolicy: IfNotPresent

  # VictoriaMetrics reads this as months when it is a bare number.
  retentionPeriod: "12"

  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# ── Prompt registry ──────────────────────────────────────────────────────────
#
# Where prompts are kept. The one store in this chart whose contents cannot be
# reconstructed: runs, spans and metrics are a fold over a log that can be
# replayed, and a prompt was written by a person. The version a run used has to
# outlive every trace of that run, so this is not on the server's volume beside
# the write-ahead log — that log is a rolling window a retention policy may
# delete.
#
# RustFS because it is one Rust binary with no JVM and no external metadata
# service. The adapter speaks S3, so `external` reaches MinIO, Ceph or AWS with
# no code change.
# The governed conversation archive: what people said to your agents, kept on
# purpose. Off, and it is the only thing in this file whose default is chosen so
# that doing nothing keeps nothing — every other store is on because there is
# somewhere to put it. See docs/ADR/ADR_0021_CONVERSATION_ARCHIVE.md.
conversationArchive:
  enabled: false

  # Required when enabled: the server refuses to start without a key, because an
  # archive with no key is a plaintext archive in the same bucket prompts,
  # datasets, annotations and training already read.
  #
  # The Secret holds `id:key[,id:key]`, active key first, each key 32
  # base64url bytes. The chart never generates this one — unlike the object
  # store's credentials, a key it invented would be a key nobody could restore
  # from, and losing it makes everything sealed under it unreadable.
  keysSecret:
    name: ""
    key: keys

  # Key prefix inside the same bucket the other registries use.
  prefix: conversations

  # protected | open. `protected` refuses a turn that carries no consent record
  # and no redaction record. `open` records the gaps instead, and every export
  # then excludes those turns by name, in a manifest, forever.
  policy: protected

  # The longest retention this deployment will apply. A producer asking for more
  # is shortened to this, and the turn records that it was.
  maxTtlDays: 365

  # Whether the server's own scan refusing content is fatal. Off: a scanner is a
  # heuristic, and one that rejects a write throws away the only copy of an
  # exchange because a hex string looked like a key. A finding always blocks the
  # export, which is the gate that matters.
  rejectOnFinding: false

  # How often the retention sweep runs.
  sweepSeconds: 3600

# Durable evaluation evidence: what a variant scored, kept after the traces that
# produced it have been evicted. Off, because it needs something this chart
# cannot invent — the approval bundles an operator admits. ADR_0030.
#
# The evidence itself goes into the same bucket as everything else, under an
# `evaluations/` prefix, so turning this on adds no store and no network path.
# What it does add is a directory the server reads: one subdirectory per
# approval, named by the pair it admits, holding the suite, the scorer, the
# schemas and the case manifest that pair was measured against. Approving is
# then an API call (`POST /api/v1/evaluation-approvals`, `admin`), and every
# publication of an admitted pair needs nothing on this host.
evaluationEvidence:
  enabled: false

  # Where those bundles are mounted. Read-only: nothing in aiwatcher writes here.
  sourceDir: /etc/aiwatcher/evaluation-approvals

  # The volume that directory comes from, rendered verbatim — a ConfigMap for a
  # text-only bundle, a PersistentVolumeClaim for one with model artifacts in
  # it. Required when enabled: a bundle nobody mounted makes every publication
  # a 403, which reads as a permissions problem rather than a missing volume.
  #
  #   volume:
  #     configMap: { name: evaluation-approvals }
  volume: {}

  # The instance's starting limits. Measure before raising them: a summary and a
  # catalogue page are bounded by the first two, and `pageSize` is capped at 200
  # by the registry itself.
  limits:
    maxCases: 10000
    maxBytes: 104857600
    pageSize: 200
    # How long published evidence is kept. A source's own retention can shorten
    # this and never lengthens it.
    retentionDays: 30

promptStore:
  # install | external | none.
  #
  # `none` is a real choice, not a failure: the panel's Prompts tab then says
  # which variable is unset rather than showing an empty list, and every
  # `/api/v1/prompts` route answers 501.
  mode: install

  # Key prefix inside the bucket, so one bucket can hold this registry beside
  # whatever else a cluster keeps in it.
  prefix: prompts
  bucket: aiwatcher-prompts

  # Credentials. With `mode: install` and no name here, the chart generates a
  # Secret on first install and reuses it on every upgrade — see
  # templates/rustfs.yaml for why that lookup matters. With `mode: external`
  # this is required: the chart cannot invent credentials for somebody else's
  # bucket.
  credentialsSecret:
    name: ""
    accessKeyKey: accessKey
    secretKeyKey: secretKey

  external:
    # Base URL of an S3 endpoint, e.g. http://minio.storage.svc:9000
    endpoint: ""
    # Filled in by the detection script when it finds an S3 endpoint. Used only
    # by the NetworkPolicy below, to add an ingress rule to pods this chart does
    # not own — the same mechanism the Collector uses to reach a fenced
    # VictoriaMetrics.
    podSelector: {}
    namespace: ""
    # Signed into every request. Any S3 implementation other than AWS ignores
    # the value and only needs both sides to agree.
    region: us-east-1
    # Whether the server may create the bucket when it is missing. Off for an
    # external store: credentials scoped to one bucket usually may not, and the
    # failure is clearer at start-up than at the first publish.
    createBucket: false

  image:
    repository: rustfs/rustfs
    tag: 1.0.0-rc.3
    pullPolicy: IfNotPresent

  persistence:
    # On by default, unlike everywhere else in this chart that offers the
    # choice. A lost span is in the trace store; a lost prompt is gone.
    enabled: true
    size: 5Gi
    storageClassName: ""

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# ── Perses wiring ────────────────────────────────────────────────────────────
#
# This chart never installs Perses — every cluster that wants one already has
# one, and a second would be a second thing to authenticate. It emits the
# datasource provisioning instead.
#
# Perses has no equivalent of Grafana's datasource-level tracesToMetrics /
# tracesToLogs correlation, so that link is gone rather than renamed. A span
# still carries `gen_ai.request.model`; what is missing is the one click from a
# span to the metric filtered by it.
perses:
  provisioning:
    enabled: true
    # A Perses whose chart runs the provisioning sidecar picks the ConfigMap up
    # from this label alone — the sidecar watches `perses.dev/resource: "true"`.
    # Perses provisioned from fixed ConfigMap mounts (which is how planner does
    # it) does not; see docs/INSTALL.md for the one-line change on that side.
    labels:
      perses.dev/resource: "true"
    # Perses references datasources by name, not by uid. This is the name the
    # emitted GlobalDatasource takes; it has to be unique among the global
    # datasources the target Perses already has.
    tracesDatasourceName: aiwatcher-traces

# ── Ingress ──────────────────────────────────────────────────────────────────
#
# One host for the panel; /api goes to the same host and is proxied by the panel
# to the server, so there is one origin and no CORS.
ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: true
    # Empty means <host>-tls.
    secretName: ""

  # Extra routes on the same host, each rendered as its own Ingress so each can
  # carry its own annotations. What this is for: a forward-auth callback path
  # that has to bypass the middleware guarding everything else and reach a
  # different backend. See environments/planner.yaml.
  #
  #   - name: authentik-outpost
  #     path: /outpost.goauthentik.io/
  #     annotations: {...}
  #     service: { name: planner-authentik-outpost, portName: http }
  extraRoutes: []

# ── NetworkPolicy ────────────────────────────────────────────────────────────
networkPolicy:
  # Ingress rules for this release's own pods. Coarse: the server's ingest route
  # is how every SDK publishes, and this chart does not know which workloads
  # those are, so the rule is "any pod in this namespace" plus the selectors
  # below. See templates/networkpolicy.yaml.
  enabled: false

  # Extra `from` entries appended to the server's ingress rule — a
  # namespaceSelector for agents that run elsewhere, for instance.
  allowIngressFrom: []

  # An ingress rule attached to pods this release does not own, so the Collector
  # can reach a VictoriaMetrics that a stricter chart has fenced off. Policies
  # are additive, so this grants a path without editing the other chart. Needs
  # victoriametrics.external.podSelector, which the detection script fills in.
  allowEgressToExternalVictoriaMetrics: false
  allowEgressToExternalVictoriaTraces: false
  # The same thing for an external object store. Off by default and only ever
  # correct when that store is *already* fenced: a policy attached to pods no
  # policy selects narrows them from "accepts everything" to "accepts aiwatcher
  # only", which would cut off whoever else was using the bucket.
  allowEgressToExternalPromptStore: false
  # The same thing for an external PostgreSQL, with the same warning and one
  # more: a database is the backend most likely to be shared with something
  # else in the cluster, so attaching a rule to pods nothing else fences would
  # cut off every other application using it.
  allowEgressToExternalWorkflowStore: false
