{{- if .Values.scorers.enabled }}
{{- $fullname := include "aiwatcher.fullname" . -}}
{{- $s := .Values.scorers -}}
{{- if eq .Values.execution.store "none" -}}
{{- fail "scorers.enabled is true but execution.store is \"none\". Only a managed run asks the scorer service — the role holding the reactors records its catalog and scores each case — so with no workflow store it would be a pod nothing ever calls." -}}
{{- end -}}
{{- $graded := or $s.model.url $s.model.name $s.model.revision -}}
{{- if and $graded (not (and $s.model.url $s.model.name $s.model.revision)) -}}
{{- fail "scorers.model is url, name and revision together, or none: the name and the revision are pinned into every card a graded metric measured." -}}
{{- end -}}
{{- $model := include "aiwatcher.scorersModelEgress" . | fromYaml -}}
{{- if and .Values.networkPolicy.enabled $model.outside (not $s.egress.rules) (not $s.egress.open) -}}
{{- fail (printf "scorers.model.url names %s, a host outside this cluster, and a NetworkPolicy cannot name a hostname: list its addresses as egress rules in scorers.egress.rules, or set scorers.egress.open: true to leave the scorer pod's egress unrestricted." $model.outside) -}}
{{- end -}}
{{- $token := include "aiwatcher.scorersToken" . | fromYaml -}}
# The scorer service (services/scorers): DeepEval's and Opik's metrics for a
# scorecard's `external` scorers, asked by the role holding the reactors.
#
# ClusterIP and no ingress path. Nothing a person uses talks to it — a card is
# published against the catalog the work role recorded — and it is sent the
# cases it scores, so the only pods that reach it are aiwatcher's own roles.
{{- if not $s.tokenSecret.name }}
# The bearer token both routes want, generated once and kept: read back from the
# cluster on an upgrade, so a rollout never leaves the service and its callers
# holding two different ones. Named in `scorers.tokenSecret` instead, this is not
# rendered.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $token.name }}
  labels:
    {{- include "aiwatcher.labels" . | nindent 4 }}
    app.kubernetes.io/component: scorers
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $token.name }}
  token: {{ (and $existing (index $existing.data "token")) | default (randAlphaNum 48 | b64enc) | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-scorers
  labels:
    {{- include "aiwatcher.labels" . | nindent 4 }}
    app.kubernetes.io/component: scorers
spec:
  selector:
    {{- include "aiwatcher.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: scorers
  ports:
    - { name: http, port: 8083, targetPort: http, protocol: TCP }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-scorers
  labels:
    {{- include "aiwatcher.labels" . | nindent 4 }}
    app.kubernetes.io/component: scorers
spec:
  replicas: {{ $s.replicas }}
  selector:
    matchLabels:
      {{- include "aiwatcher.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scorers
  template:
    metadata:
      labels:
        {{- include "aiwatcher.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: aiwatcher
        app.kubernetes.io/component: scorers
    spec:
      automountServiceAccountToken: false
      {{- include "aiwatcher.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        # 10001 is the user deploy/Dockerfile.scorers creates.
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: scorers
          image: "{{ $s.image.repository }}:{{ $s.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $s.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8083, protocol: TCP }
          env:
            - { name: AIWATCHER_SCORERS_ADAPTERS, value: {{ $s.adapters | quote }} }
            - name: AIWATCHER_SCORERS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $token.name }}
                  key: {{ $token.key }}
            {{- if $graded }}
            - { name: AIWATCHER_SCORERS_MODEL_URL, value: {{ $s.model.url | trimSuffix "/" | quote }} }
            - { name: AIWATCHER_SCORERS_MODEL, value: {{ $s.model.name | quote }} }
            - { name: AIWATCHER_SCORERS_MODEL_REVISION, value: {{ $s.model.revision | quote }} }
            - { name: AIWATCHER_SCORERS_MODEL_PROFILE, value: {{ $s.model.profile | quote }} }
            {{- with $s.model.tokenSecret }}
            {{- if .name }}
            - name: AIWATCHER_SCORERS_MODEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
            {{- end }}
          # /health carries no credential and says only which adapters loaded.
          # Importing both frameworks takes seconds, hence the delay.
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml $s.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # HOME and the working directory: DeepEval keeps `.deepeval` beside
            # where it runs, and Opik and LiteLLM read the home directory.
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with $s.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
