{{- $fullname := include "aiwatcher.fullname" . -}}
{{- $otlp := include "aiwatcher.otlpEndpoint" . -}}
{{- $promptStore := include "aiwatcher.promptStoreEndpoint" . -}}
{{- if hasKey .Values "engine" -}}
{{- fail "engine is set, but the Flyte pipeline engine has been removed from aiwatcher and every value under engine went with it. Delete the engine block from your values. A rerun sent to an HTTP endpoint is AIWATCHER_WORKFLOW_RUNNER=http in server.extraEnv." -}}
{{- end -}}
{{- /* The names query's values had while Flow was the only engine, read for the
release that renamed them (AW-3) and refused since: each switched something on,
and a release that ignored it would come up without the engine it asked for. */ -}}
{{- if (.Values.flow | default dict).enabled -}}
{{- fail "flow.enabled is true, but flow was the name of query while Flow was the only engine, read for one release only. Set query.enabled: true instead (query.engine defaults to flow), move flow.image to query.images.flow and flow.resources to query.resources.flow, and delete the flow block." -}}
{{- end -}}
{{- if .Values.panel.flowUpstream -}}
{{- fail "panel.flowUpstream is set, but it was the older name of panel.queryUpstream, read for one release only. Rename it to panel.queryUpstream." -}}
{{- end -}}
{{- if .Values.execution.flowUrl -}}
{{- fail "execution.flowUrl is set, but it was the older name of execution.queryUrl, read for one release only. Rename it to execution.queryUrl." -}}
{{- end -}}
{{- if and (eq .Values.auth.mode "proxy") (not .Values.networkPolicy.enabled) -}}
{{- fail "auth.mode is \"proxy\" but networkPolicy.enabled is false. That mode takes the caller's identity from request headers, which is only sound while nothing but the authenticating proxy can reach the server. With no policy, any pod in the namespace can claim to be an admin. Turn the policy on, or use auth.mode \"oidc\", where the identity is proved to this process rather than asserted to it." -}}
{{- end -}}
{{- if and .Values.conversationArchive.enabled (not .Values.conversationArchive.keysSecret.name) -}}
{{- fail "conversationArchive.enabled is true but conversationArchive.keysSecret.name is empty. The archive holds what people said to your agents, sealed with that key, in the same bucket prompts, datasets, annotations and training already read — so an archive with no key is a plaintext archive. The chart will not generate one: a key it invented would be a key nobody could restore from. Create a Secret holding `id:key` (32 base64url bytes) and name it here." -}}
{{- end -}}
{{- if and .Values.conversationArchive.enabled (not $promptStore) -}}
{{- fail "conversationArchive.enabled is true but promptStore.mode is \"none\". The archive writes to the same object store as the other authored registries; with none configured, every /api/v1/conversation-* route would answer 501 while the deployment believed capture was on." -}}
{{- end -}}
{{- if and (eq .Values.execution.store "postgres") (eq .Values.postgresql.mode "none") -}}
{{- fail "execution.store is \"postgres\" but postgresql.mode is \"none\". The workflow store is where a managed run's plan, decisions and outbox live in one transaction; with no database the server refuses to start rather than running managed executions on something weaker. Set postgresql.mode to \"install\" or \"external\", or set execution.store to \"file\" (one process only) or \"none\"." -}}
{{- end -}}
{{- if and (eq .Values.execution.store "file") (not .Values.server.persistence.enabled) -}}
{{- fail "execution.store is \"file\" but server.persistence.enabled is false. That store is one directory of append-only files, so on an emptyDir every managed run is forgotten when the pod restarts — including one that was still running. Turn persistence on, or use \"postgres\"." -}}
{{- end -}}
{{- if and (eq .Values.server.bus "laser") (not .Values.server.laser.connectionStringSecret.name) -}}
{{- fail "server.bus is \"laser\" but server.laser.connectionStringSecret.name is empty. The connection string carries a password, so it comes from a Secret." -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-server
  labels:
    {{- include "aiwatcher.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  selector:
    {{- include "aiwatcher.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - { name: http, port: 8080, targetPort: http, protocol: TCP }
{{- if .Values.server.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-server-data
  labels:
    {{- include "aiwatcher.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.server.persistence.size }}
  {{- include "aiwatcher.storageClass" .Values.server.persistence | nindent 2 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-server
  labels:
    {{- include "aiwatcher.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  # Not a placeholder. See the comment on `server` in values.yaml: a second
  # replica gets its own live hub and its own read model.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: two projectors in the same consumer group
    # would both consume during the overlap, and the one being torn down would
    # commit offsets for events the new one never saw.
    type: Recreate
  selector:
    matchLabels:
      {{- include "aiwatcher.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "aiwatcher.selectorLabels" . | nindent 8 }}
        # Not in the selector — the selector is immutable, and this is here so
        # deploy/scripts/detect-stack.py can tell aiwatcher's own pods from the
        # ones it is looking for. See that script.
        app.kubernetes.io/part-of: aiwatcher
        app.kubernetes.io/component: server
    spec:
      {{- if and .Values.execution.pods.templates (not .Values.execution.splitRoles) }}
      # This process holds the reactors, so it starts the pods steps ask for
      # (ADR_0029) — the one pod here with a cluster token, and its Role is
      # Jobs and pod logs in one namespace.
      serviceAccountName: {{ $fullname }}-launcher
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      {{- include "aiwatcher.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: aiwatcher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: AIWATCHER_LISTEN, value: "0.0.0.0:8080" }
            - { name: AIWATCHER_ROLE, value: {{ ternary "serve" "both" .Values.execution.splitRoles | quote }} }
            {{- include "aiwatcher.serverEnv" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            # Distinct from liveness: a projector replaying a backlog is alive
            # but not ready, and restarting it would make the replay start over.
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/aiwatcher }
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.execution.pods.templates }}
            - { name: pod-templates, mountPath: /etc/aiwatcher/pods, readOnly: true }
            {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          {{- if .Values.server.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ $fullname }}-server-data }
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.execution.pods.templates }}
        - name: pod-templates
          configMap: { name: {{ $fullname }}-pod-templates }
        {{- end }}
