# The local stack.
#
#   Python / TypeScript agents
#            │
#            ▼
#     aiwatcher (Rust)  ─┬─ write-ahead log on disk    events, bounded by retention
#            │        └─ RustFS (S3)               prompts, bounded by nothing
#            │
#            ├──► otel-collector ──┬──► victoriatraces   full spans
#            │                     └──► victoriametrics  aggregates
#            └──► SSE / WebSocket ────► panel
#
# The Collector is in the path on purpose even though aiwatcher can post OTLP
# straight to VictoriaTraces: it is where sampling, redaction and a second
# destination get added later, and putting it in from the start means doing so
# is a config change rather than a redeploy.
#
# Bring it up with `make stack-up` from the repo root.

name: aiwatcher

services:
  victoriatraces:
    # Young, but the only one of these that takes OTLP spans natively and
    # exposes a Jaeger-compatible API for Perses to read.
    image: victoriametrics/victoria-traces:v0.11.0
    command:
      - -storageDataPath=/vtdata
      - -retentionPeriod=30d
      - -httpListenAddr=:10428
    volumes:
      - victoriatraces-data:/vtdata
    ports:
      - '10428:10428'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:10428/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 6

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.150.0
    command:
      - -storageDataPath=/vmdata
      - -retentionPeriod=12
      # OTLP ingestion is off unless asked for.
      - -opentelemetry.usePrometheusNaming=true
      - -httpListenAddr=:8428
    volumes:
      - victoriametrics-data:/vmdata
    ports:
      - '8428:8428'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:8428/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 6

  # The prompt registry's store. An S3 endpoint, so the same adapter reaches
  # MinIO, Ceph or AWS unchanged — RustFS is here because it is one Rust binary
  # with no JVM and no external metadata service.
  #
  # Separate from `aiwatcher-data` on purpose: the write-ahead log is a rolling
  # window a retention policy may delete, and a prompt has to outlive every run
  # that used it.
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.3
    environment:
      # Local only. A deployment sets real credentials — see deploy/helm.
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: 'false'
    volumes:
      - rustfs-data:/data
    ports:
      - '9010:9000'
    healthcheck:
      # An unsigned request is answered with 403 AccessDenied, which is proof
      # the S3 endpoint is up. A 200 here would mean it is not authenticating.
      test:
        [
          'CMD-SHELL',
          'wget -q -S -O /dev/null http://127.0.0.1:9000/ 2>&1 | grep -q "403 Forbidden"',
        ]
      interval: 10s
      timeout: 3s
      retries: 6

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - '4318:4318' # OTLP/HTTP — what aiwatcher posts to
      - '13133:13133' # health
    depends_on:
      victoriatraces:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy

  aiwatcher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      AIWATCHER_LISTEN: '0.0.0.0:8080'
      AIWATCHER_BUS: wal
      AIWATCHER_DATA_DIR: /var/lib/aiwatcher
      AIWATCHER_OTLP_ENDPOINT: 'http://otel-collector:4318'
      AIWATCHER_SERVICE_NAME: aiwatcher
      # On in the local stack so `curl` and the browser can publish. Leave it
      # off in production, where producers reach Laser directly.
      AIWATCHER_INGEST_ENABLED: 'true'
      AIWATCHER_LOG: 'info,aiwatcher=debug'
      AIWATCHER_LOG_FORMAT: pretty
      # The prompt registry, in the object store rather than on the container's
      # disk. The bucket is created at start-up if it is not there.
      AIWATCHER_PROMPT_STORE: s3
      AIWATCHER_PROMPT_S3_ENDPOINT: 'http://rustfs:9000'
      AIWATCHER_PROMPT_S3_BUCKET: aiwatcher-prompts
      AIWATCHER_PROMPT_S3_ACCESS_KEY: rustfsadmin
      AIWATCHER_PROMPT_S3_SECRET_KEY: rustfsadmin
      # The query engine managed query steps run against — the `query` service
      # below. One variable picks both: which engine that service builds, and
      # which engine the server compiles plans for.
      AIWATCHER_QUERY_ENGINE: ${AIWATCHER_QUERY_ENGINE:-flow}
      AIWATCHER_QUERY_URL: 'http://query:8081'
      # A step's clock; the `query` service's ceiling below stays a minute above it.
      AIWATCHER_QUERY_STEP_TIMEOUT_SECONDS: ${AIWATCHER_QUERY_STEP_TIMEOUT_SECONDS:-300}
    volumes:
      - aiwatcher-data:/var/lib/aiwatcher
    ports:
      - '8080:8080'
    depends_on:
      otel-collector:
        condition: service_started
      rustfs:
        condition: service_healthy
    # The read-model caps in ReadModelConfig are sized for this ceiling. Raising
    # the limit without raising AIWATCHER_MAX_SPANS_TOTAL just leaves headroom
    # unused; lowering it without lowering them risks an OOMKill.
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:8080/livez || exit 1']
      interval: 10s
      timeout: 3s
      retries: 6

  # The query engine (services/query, AW-3): Flow PHP, DataFusion or DuckDB,
  # whichever AIWATCHER_QUERY_ENGINE names — one Dockerfile, one target each.
  # Not published on the host: no engine has authentication of its own, and its
  # client here is the server.
  query:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.query
      target: ${AIWATCHER_QUERY_ENGINE:-flow}
    environment:
      AIWATCHER_URL: 'http://aiwatcher:8080'
      AIWATCHER_QUERY_ADMISSION: ${AIWATCHER_QUERY_ADMISSION:-open}
      # Above the server's step timeout, so a long step is stopped by its own
      # clock and retried rather than refused here. Raise the two together.
      AIWATCHER_QUERY_TIMEOUT_SECONDS: ${AIWATCHER_QUERY_TIMEOUT_SECONDS:-360}

  perses:
    # Anonymous and writable — see deploy/perses/config.yaml. The Jaeger and
    # Prometheus datasource plugins ship inside this image, so unlike the
    # Grafana this replaces there is nothing to install at start-up.
    #
    # No healthcheck: the image is distroless, with no shell and no wget to run
    # one with. `just stack-up` prints the URL; /api/v1/health answers on it.
    image: persesdev/perses:v0.54.0
    command:
      - --config=/etc/perses/config.yaml
      - --web.listen-address=:8080
      - --log.level=info
    volumes:
      - ./perses/config.yaml:/etc/perses/config.yaml:ro
      - ./perses/provisioning:/etc/perses/provisioning:ro
      - perses-data:/perses
    ports:
      - '3000:8080'
    depends_on:
      - victoriatraces
      - victoriametrics

volumes:
  rustfs-data:
  victoriatraces-data:
  victoriametrics-data:
  aiwatcher-data:
  perses-data:
