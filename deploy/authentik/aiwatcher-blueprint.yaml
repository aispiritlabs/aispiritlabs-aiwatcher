# The authentik side of aiwatcher's single sign-on, as a blueprint.
#
# Applied automatically by `just authentik-up`, which mounts this directory at
# /blueprints/custom. In a cluster, put it in the ConfigMap authentik's worker
# reads, or paste it into Admin → Customisation → Blueprints.
#
# What it creates:
#
#   * three groups, which are the whole authorisation model — aiwatcher maps
#     group names to roles and knows nothing else about people;
#   * an OAuth2/OpenID provider, confidential, with PKCE;
#   * an application, whose *slug* is what makes the issuer URL. aiwatcher is
#     configured with `https://<host>/application/o/aiwatcher/`, and getting the
#     provider name in there instead is the most common failure in this file.
#
# Written against authentik 2025.6. Two things have changed shape in recent
# releases and are worth checking against yours: `redirect_uris` was a
# newline-separated string before 2024.10 and is a list of objects now, and
# `invalidation_flow` became required at the same time.
#
# The client secret is NOT here. A blueprint is a file people copy; a secret in
# one is a secret in a git history. authentik generates it — read it once from
# Admin → Providers → aiwatcher and put it wherever the server reads
# AIWATCHER_AUTH_CLIENT_SECRET from.
version: 1
metadata:
  name: aiwatcher
  labels:
    blueprints.goauthentik.io/description: Single sign-on for aiwatcher

entries:
  # ── Groups ─────────────────────────────────────────────────────────────────
  #
  # Membership is managed here and nowhere else. aiwatcher re-reads it on every
  # sign-in and never stores it, so removing somebody from a group takes effect
  # at their next session rather than needing anything done in aiwatcher.
  - model: authentik_core.group
    id: admins
    identifiers:
      name: aiwatcher-admins
    attrs:
      attributes:
        description: >-
          May dispatch a workflow rerun, which is the only thing aiwatcher does
          that asks another system to run something.

  - model: authentik_core.group
    id: editors
    identifiers:
      name: aiwatcher-editors
    attrs:
      attributes:
        description: >-
          May publish prompt versions, move labels, record optimisations and
          publish events over HTTP.

  - model: authentik_core.group
    id: viewers
    identifiers:
      name: aiwatcher-viewers
    attrs:
      attributes:
        description: >-
          May read everything. Not usually needed: an authenticated user in no
          mapped group is already a viewer unless
          AIWATCHER_AUTH_DEFAULT_ROLE=none says otherwise.

  # ── Provider ───────────────────────────────────────────────────────────────
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: aiwatcher
    attrs:
      # Implicit consent: aiwatcher is a first-party application, and a consent
      # screen asking somebody to let the company's own dashboard see their
      # email is a click that teaches people to click.
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Named rather than left to the default, which is **empty** on authentik
      # 2026.x — and an empty list refuses the authorization-code flow with
      # `invalid_request`, which reads as a redirect-URI mistake and is not one.
      grant_types:
        - authorization_code
        - refresh_token
      client_id: aiwatcher
      # Strict, not regex. aiwatcher sends one redirect URI and only one, and a
      # pattern here is how a redirect URI stops being a check.
      #
      # Two entries because the panel's dev server proxies /api, so a developer
      # comes back to :5173 rather than to :8080. Delete the second one in any
      # deployment that is not somebody's laptop.
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:5173/api/v1/auth/callback
        - matching_mode: strict
          url: https://aiwatcher.example.test/api/v1/auth/callback
      # `groups` rides in on the profile scope. Without this mapping the id
      # token carries no groups, everybody is a viewer, and nothing anywhere
      # says why — which is the reason aiwatcher falls back to `userinfo`.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Short. The id token is read once, at the moment of sign-in, and
      # discarded — aiwatcher keeps a session of its own and never refreshes
      # against the provider, so a long-lived token here buys nothing.
      access_token_validity: minutes=10
      refresh_token_validity: days=30

  # ── Application ────────────────────────────────────────────────────────────
  #
  # The slug is load-bearing: the issuer aiwatcher is configured with is
  # `https://<host>/application/o/<this slug>/`.
  - model: authentik_core.application
    id: application
    identifiers:
      slug: aiwatcher
    attrs:
      name: aiwatcher
      provider: !KeyOf provider
      meta_description: Observability for agent runs.
      # Deliberately not restricted to the three groups above. Who may reach
      # aiwatcher at all is an authentik policy binding; what they may do once
      # they have is the group mapping. Conflating them means the only way to
      # give somebody read access is to give them a role.
      policy_engine_mode: any

  # ── Enrolment, for somebody an aiwatcher invitation reached ────────────────
  #
  # aiwatcher's own invitation offers a project to a secret, and the grant is
  # written against the `(provider, subject)` pair a session proves — so the
  # person has to have an account here first. This is where they make one:
  # aiwatcher asks authentik to open *this* flow to one person
  # (AIWATCHER_AUTH_PROVISION_URL and the two variables beside it) and sends
  # them to it with the token in the query.
  #
  # Two rules carry it, and both are visible in this file.
  #
  #   * **The flow assigns no group.** Every aiwatcher group here is a role on
  #     the whole deployment, and a client invited to one project must hold
  #     none of them — that is the whole of IAM-03's D4, and a `groups:` line
  #     in the user-write stage below would undo it silently.
  #   * **The invitation stage is required.** Without `continue_flow_without_
  #     invitation: false` this is open self-service registration for anybody
  #     who finds the URL.
  #
  # The service account aiwatcher uses needs permission to add an invitation
  # and nothing else. A token that could create users or edit group membership
  # would make aiwatcher a tool for making accounts in this provider.
  - model: authentik_stages_invitation.invitationstage
    id: enrolment-invitation
    identifiers:
      name: aiwatcher-enrolment-invitation
    attrs:
      continue_flow_without_invitation: false

  - model: authentik_stages_prompt.prompt
    id: prompt-username
    identifiers:
      field_key: username
    attrs:
      label: Username
      type: username
      required: true
      placeholder: Username
      order: 100

  - model: authentik_stages_prompt.prompt
    id: prompt-email
    identifiers:
      field_key: email
    attrs:
      label: Email
      type: email
      required: true
      placeholder: Email
      order: 101

  - model: authentik_stages_prompt.prompt
    id: prompt-password
    identifiers:
      field_key: password
    attrs:
      label: Password
      type: password
      required: true
      placeholder: Password
      order: 200

  - model: authentik_stages_prompt.prompt
    id: prompt-password-repeat
    identifiers:
      field_key: password_repeat
    attrs:
      label: Password (again)
      type: password
      required: true
      placeholder: Password (again)
      order: 201

  - model: authentik_stages_prompt.promptstage
    id: enrolment-prompt
    identifiers:
      name: aiwatcher-enrolment-prompt
    attrs:
      fields:
        - !KeyOf prompt-username
        - !KeyOf prompt-email
        - !KeyOf prompt-password
        - !KeyOf prompt-password-repeat

  # No `groups`: a new account holds no aiwatcher role, which is what lets
  # AIWATCHER_AUTH_DEFAULT_ROLE=project mean anything.
  - model: authentik_stages_user_write.userwritestage
    id: enrolment-write
    identifiers:
      name: aiwatcher-enrolment-write
    attrs:
      create_users_as_inactive: false
      user_creation_mode: always_create
      user_type: internal

  - model: authentik_stages_user_login.userloginstage
    id: enrolment-login
    identifiers:
      name: aiwatcher-enrolment-login
    attrs:
      session_duration: seconds=0

  - model: authentik_flows.flow
    id: enrolment
    identifiers:
      slug: aiwatcher-enrolment
    attrs:
      name: aiwatcher enrolment
      title: Create your aiwatcher account
      designation: enrollment
      # The flow is reachable only with an invitation token, so it may be
      # linked to directly — the invitation stage is what decides.
      authentication: require_unauthenticated

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrolment
      stage: !KeyOf enrolment-invitation
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrolment
      stage: !KeyOf enrolment-prompt
      order: 20

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrolment
      stage: !KeyOf enrolment-write
      order: 30

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrolment
      stage: !KeyOf enrolment-login
      order: 40
