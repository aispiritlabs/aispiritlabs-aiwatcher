apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # VictoriaTraces speaks the Jaeger query API, so Grafana reads it with no
      # plugin. This is the historical view; aiwatcher's own panel draws runs
      # that are still in flight, which a trace store cannot show.
      - name: VictoriaTraces
        type: jaeger
        uid: victoriatraces
        access: proxy
        url: http://victoriatraces:10428/select/jaeger
        jsonData:
          tracesToMetrics:
            datasourceUid: victoriametrics
            tags:
              - key: gen_ai.request.model
                value: model

      - name: VictoriaMetrics
        type: prometheus
        uid: victoriametrics
        access: proxy
        url: http://victoriametrics:8428
        isDefault: true
        jsonData:
          httpMethod: POST
          timeInterval: 15s
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.6.0
          env:
            # Anonymous admin: this is a throwaway local cluster. Never carry
            # this block into anything reachable from outside a laptop.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: 'true'
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: 'true'
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
