apiVersion: 1

datasources:
  # VictoriaTraces speaks the Jaeger query API, so Grafana's Jaeger data source
  # reads it without a plugin. This is what the waterfall view in Grafana uses;
  # aiwatcher's own panel draws in-progress runs from the read model instead,
  # because a trace store cannot show a run that has not finished.
  - name: VictoriaTraces
    type: jaeger
    uid: victoriatraces
    access: proxy
    url: http://victoriatraces:10428/select/jaeger
    isDefault: false
    jsonData:
      tracesToMetrics:
        datasourceUid: victoriametrics
        tags:
          - key: gen_ai.request.model
            value: model
      tracesToLogsV2:
        datasourceUid: victoriametrics

  - name: VictoriaMetrics
    type: prometheus
    uid: victoriametrics
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
