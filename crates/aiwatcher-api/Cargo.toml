[package]
name = "aiwatcher-api"
description = "axum router: REST reads, SSE and WebSocket live streams, OpenAPI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
aiwatcher-core.workspace = true
aiwatcher-evaluation.workspace = true
aiwatcher-auth.workspace = true
aiwatcher-bus.workspace = true
aiwatcher-annotations.workspace = true
aiwatcher-conversations.workspace = true
aiwatcher-datasets.workspace = true
aiwatcher-execution.workspace = true
aiwatcher-projector.workspace = true
aiwatcher-prompts.workspace = true
aiwatcher-training.workspace = true
async-trait.workspace = true
axum.workspace = true
futures.workspace = true
serde.workspace = true
# For the repeated query parameters of the live selection: axum's `Query` uses
# `serde_urlencoded`, which has no sequence support at all, so `?agent=a&agent=b`
# has to be read off the raw query string.
url.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower-http.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true

[dev-dependencies]
# The digest rule, called rather than copied: the test double has to
# content-address the way the real store does, or the test that stops a worker
# fabricating a reference would pass against a double that cannot tell.
aiwatcher-jobs.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
