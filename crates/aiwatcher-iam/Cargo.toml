[package]
name = "aiwatcher-iam"
description = "Organizations, teams and project access: transactional membership and grant policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = []
postgres = ["dep:sqlx"]
openapi = ["dep:utoipa"]

[dependencies]
async-trait.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
# `v4` for invitation tokens: a v7 is time-ordered, and a secret that carries
# the moment it was minted is a secret with a shape.
uuid = { workspace = true, features = ["v4"] }
utoipa = { workspace = true, optional = true, features = ["uuid"] }

[lints]
workspace = true
