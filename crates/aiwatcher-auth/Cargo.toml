[package]
name = "aiwatcher-auth"
description = "Single sign-on: an OIDC relying party, signed sessions, and the roles a group maps to."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# `openapi` because `Identity` is in the contract and now names a project.
# Without it this crate builds only when something else in the graph turns the
# feature on, which is a crate that compiles by luck.
aiwatcher-iam = { workspace = true, features = ["openapi"] }
base64.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
url.workspace = true
utoipa.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
