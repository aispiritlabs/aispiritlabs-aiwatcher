[package]
name = "aiwatcher-annotations"
description = "Vector image annotations, their label schemas, and the immutable training exports built from them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aiwatcher-core.workspace = true
# The lease, the cursor, the shard and the content address a finished job is
# named by, shared with the conversation archive's export. See ADR_0022.
aiwatcher-jobs.workspace = true
# One port in this crate is async: `ImageSource`, which is what lets the import
# job run without knowing a hub exists.
async-trait.workspace = true
# A hub returns a binary column as base64 in the row itself, so decoding one is
# how a picture stored as bytes rather than as a URL is read at all.
base64.workspace = true
hex.workspace = true
# The hub search reaches Kaggle and Hugging Face. It is an adapter living
# beside the curated table it reconciles against — the same shape as the
# object-store adapters in `aiwatcher-prompts`.
reqwest = { workspace = true, features = ["json", "query"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
# `lookup_host`: every address a fetch would connect to is checked before the
# connection is made. See `integrations::fetch`.
tokio.workspace = true
utoipa.workspace = true

[dev-dependencies]
aiwatcher-prompts.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
