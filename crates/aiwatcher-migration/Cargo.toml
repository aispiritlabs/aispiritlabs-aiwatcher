[package]
name = "aiwatcher-migration"
description = "Operator tooling that moves an authored registry into one named IAM project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "aiwatcher-migrate"
path = "src/bin/aiwatcher-migrate.rs"

[dependencies]
aiwatcher-annotations.workspace = true
aiwatcher-core.workspace = true
aiwatcher-datasets.workspace = true
aiwatcher-iam.workspace = true
aiwatcher-prompts.workspace = true
aiwatcher-training.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "macros"] }

# The authoritative IAM store is PostgreSQL and nothing else: the server
# refuses to start on a memory store in `oidc` mode, so a cutover authorized by
# one would be authorized by a fixture. Behind a feature for the reason `laser`
# is — a build that only plans a migration has no business pulling `sqlx` in.
[features]
postgres = ["aiwatcher-iam/postgres"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
