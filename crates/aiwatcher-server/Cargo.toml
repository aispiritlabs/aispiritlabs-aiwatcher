[package]
name = "aiwatcher-server"
description = "The deployable binary: configuration, wiring and graceful shutdown."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# The `aiwatcher` binary lives in `aiwatcher-cli`, which depends on this crate:
# running the server is one of the command line's commands rather than the whole
# of it. What stays here is the contract generator, which is a build tool and
# has no command line to be part of.
[[bin]]
name = "aiwatcher-openapi"
path = "src/bin/aiwatcher-openapi.rs"

[features]
default = []
# Wires the real Laser backend. Off by default so a plain `cargo build` needs
# neither the SDK nor a broker.
laser = ["aiwatcher-bus/laser"]
# Wires the PostgreSQL workflow store. Off by default for the same reason and
# in the same shape: a plain build needs no database and no sqlx, and
# `AIWATCHER_WORKFLOW_STORE=postgres` without it refuses to start naming this
# feature rather than falling back to the store that holds one process.
postgres = ["aiwatcher-execution/postgres"]
# The single-machine pair of the two above: DuckDB for the workflow store and
# the durable read model, Iggy over HTTP for the log. What `aiwatcher up`
# builds with, and off by default for the same reason as the others.
duckdb = ["aiwatcher-execution/duckdb", "dep:duckdb"]
iggy = ["aiwatcher-bus/iggy"]
# The pod launcher's cluster client (ADR_0029). Off by default for the same
# reason: the launcher's loop and its Job manifest are in every build and
# tested there, and only what reaches a real cluster needs kube-rs.
# `AIWATCHER_POD_TEMPLATES` on a role that claims attempts, in a build without
# this, refuses to start naming it.
# `futures` because the pod log is read as a stream: the only bound the
# cluster offers is on the *first* bytes of one, and the part worth keeping is
# the last. It is already in this graph under kube-rs.
kube = ["dep:kube", "dep:k8s-openapi", "dep:futures", "dep:rustls"]

[dependencies]
aiwatcher-core.workspace = true
aiwatcher-evaluation.workspace = true
aiwatcher-bus.workspace = true
aiwatcher-annotations.workspace = true
# For the one line the import worker logs a job state with.
aiwatcher-jobs.workspace = true
aiwatcher-conversations.workspace = true
aiwatcher-training.workspace = true
aiwatcher-datasets.workspace = true
aiwatcher-execution.workspace = true
aiwatcher-trace.workspace = true
aiwatcher-projector.workspace = true
aiwatcher-prompts.workspace = true
aiwatcher-runner.workspace = true
duckdb = { workspace = true, optional = true }
kube = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }
aiwatcher-auth.workspace = true
aiwatcher-api.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
# The work role's one outbound client: the Flow query service, whose address is
# configuration. `aiwatcher-runner` holds its own for the same reason — this
# crate is where a reactor lives (section 27).
reqwest.workspace = true
serde.workspace = true
sha2.workspace = true
hex.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true

[dev-dependencies]
# The unit tests that drive a runtime: the reactors, the seed and the archive.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
