# aiwatcher — Rust backend workspace.
#
# Layering (a crate may only depend on crates above it in this list):
#
#   aiwatcher-core       domain types: ids, envelope, correlation, catalog, ports
#   aiwatcher-bus        MessageSource / MessageSink / Checkpointer + adapters
#   aiwatcher-trace      span assembly + OTLP/JSON exporters
#   aiwatcher-jobs       lease, cursor, shards: what a long job over a store is
#   aiwatcher-prompts    the prompt registry, over an object store
#   aiwatcher-datasets   curation recipes + versioned dataset artifacts
#   aiwatcher-annotations vector image annotations + immutable training exports
#   aiwatcher-training   training runs and the model versions they produce
#   aiwatcher-conversations  the encrypted conversation archive and its exports
#   aiwatcher-execution  the plan, the pure decider, and the workflow store
#   aiwatcher-runner     the workflow rerun dispatcher, over HTTP
#   aiwatcher-pipeline   pipeline engines: the launchable catalog, and starting one
#   aiwatcher-auth       OIDC relying party: discovery, JWKS, sessions, roles
#   aiwatcher-projector  the consumer pipeline + live hub + read model
#   aiwatcher-api        axum router (REST + SSE + WS) + OpenAPI
#   aiwatcher-server     wiring: config, the runtime, shutdown
#   aiwatcher-cli        the binary: the command line, and the local stack
#
# Nothing below `core` knows about Laser, VictoriaTraces or HTTP. Storage and
# transport are adapters behind the ports declared in `aiwatcher-core::ports`.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "Apache-2.0"
repository = "https://github.com/ai-spirit/aiwatcher"

[workspace.dependencies]
aiwatcher-core = { path = "crates/aiwatcher-core", version = "0.1.0" }
aiwatcher-bus = { path = "crates/aiwatcher-bus", version = "0.1.0" }
aiwatcher-trace = { path = "crates/aiwatcher-trace", version = "0.1.0" }
aiwatcher-jobs = { path = "crates/aiwatcher-jobs", version = "0.1.0" }
aiwatcher-prompts = { path = "crates/aiwatcher-prompts", version = "0.1.0" }
aiwatcher-datasets = { path = "crates/aiwatcher-datasets", version = "0.1.0" }
aiwatcher-annotations = { path = "crates/aiwatcher-annotations", version = "0.1.0" }
aiwatcher-training = { path = "crates/aiwatcher-training", version = "0.1.0" }
aiwatcher-conversations = { path = "crates/aiwatcher-conversations", version = "0.1.0" }
aiwatcher-execution = { path = "crates/aiwatcher-execution", version = "0.1.0" }
aiwatcher-runner = { path = "crates/aiwatcher-runner", version = "0.1.0" }
aiwatcher-pipeline = { path = "crates/aiwatcher-pipeline", version = "0.1.0" }
aiwatcher-auth = { path = "crates/aiwatcher-auth", version = "0.1.0" }
aiwatcher-projector = { path = "crates/aiwatcher-projector", version = "0.1.0" }
aiwatcher-api = { path = "crates/aiwatcher-api", version = "0.1.0" }
aiwatcher-server = { path = "crates/aiwatcher-server", version = "0.1.0" }

anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws", "macros"] }
# Session cookies and JWT segments are base64url; the alphabet is not something
# to hand-roll beside a signature check.
base64 = "0.22.1"
bytes = "1.10"
futures = "0.3"
hex = "0.4.3"
# JWT verification for the OIDC relying party. Version 9 rather than 11 on
# purpose: 9 signs and verifies with `ring`, which rustls already puts in this
# graph, while 11 asks for either `aws-lc-rs` (a C toolchain in the image) or
# `rust_crypto`, which pulls `rsa` — and `rsa` carries RUSTSEC-2023-0071 with no
# fixed release, so `just audit` would go red on a crate we only ever use to
# *verify* somebody else's signature.
jsonwebtoken = "9.3.1"
# The real Laser SDK, over Apache Iggy. Optional: the default build (and every
# test that does not need a broker) stays free of it, and of the ~360 crates
# beneath it.
# The crate is published as `laser-sdk`; its lib target is `laser_sdk`, which is
# what `use laser_sdk::prelude::*` names. Optional, and with default features
# off: the agent/memory/graph layers are a different product surface from the
# streaming primitives this adapter needs, and they are most of the ~360 crates.
# 0.3.1 rather than 0.3.0 because 0.3.0 no longer builds: it depends on
# `iggy = "^0.11.0-edge.4"`, cargo reads an `-edge.N` prerelease as compatible
# with every later one, and `iggy_common` 0.11.0-edge.7 turned
# `heartbeat_interval` into a `NonZeroIggyDuration`. The committed `Cargo.lock`
# is what keeps that from happening again on a machine that has not run
# `cargo update`; the floor being honest is what keeps a machine that has from
# resolving back onto the version that cannot compile.
laser-sdk = { version = "0.3.1", default-features = false, features = ["streaming"] }
# reqwest 0.13 renamed the TLS features: `rustls-tls` became `rustls`.
reqwest = { version = "0.13", default-features = false, features = ["json", "http2", "rustls"] }
# HMAC-SHA256 for the session cookie's signature and a CSPRNG for the state,
# the PKCE verifier and the nonce. Already in the graph under rustls, and the
# one place in this workspace where "write it by hand" is the wrong answer.
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The PostgreSQL workflow store, optional and off by default — the `postgres`
# feature of `aiwatcher-execution`, in the shape `laser` already has in
# `aiwatcher-bus`. Default features off on purpose: sqlx's defaults pull
# `sqlx-mysql`, which depends on `rsa`, and `rsa` carries RUSTSEC-2023-0071 with
# no fixed release — the same reason `jsonwebtoken` is pinned to 9.
sqlx = { version = "0.8", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls-ring",
  "json",
  "time",
  "uuid",
] }
# SHA-256 for content-addressed prompt versions and for SigV4. Both have to
# agree byte for byte with `hashlib.sha256` on the producer side, which is not
# something to hand-roll — unlike the FNV derivation in `core::ids`, where the
# requirement is only that every aiwatcher agrees with every other one.
sha2 = "0.11.0"
thiserror = "2.0.20"
# The CLI's profile file. TOML rather than JSON because that file is meant to be
# opened and edited by the person whose profiles they are, and a trailing comma
# in JSON is a syntax error over an address somebody typed by hand.
toml = "1.1"
# The local database, behind the `duckdb` feature everywhere it appears.
# `bundled` compiles DuckDB's amalgamation, which is minutes of build time and a
# C++ toolchain — off by default for the reason `laser` and `postgres` are.
duckdb = { version = "1.10505", features = ["bundled"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde-well-known", "macros"] }
tokio = { version = "1.53", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7"
tower = "0.5.3"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "time"] }
utoipa-axum = "0.2.0"
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Denied in CI via `-Dwarnings`; kept here so `cargo clippy` without flags is
# already representative of what the gate will say.
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Debug info goes into a `.dSYM` beside the binary, never into loose object
# files. This is not a taste preference — it is what keeps `cargo test` from
# taking half an hour on macOS.
#
# Cargo's default here is `split-debuginfo = "unpacked"`: rustc leaves one
# `.o` per codegen unit in `target/debug/deps/` and the linked binary points at
# them through a debug map. Nothing ever deletes them, so every rebuild adds
# another set — this workspace accumulated 798 325 of them in fourteen days.
#
# What makes that expensive is not the disk. macOS assesses an executable the
# first time it is run, and the assessment walks the directory the executable
# sits in. Every test binary cargo builds sits in `deps/`, so each one paid for
# a walk of eight hundred thousand siblings: measured at 20-80 s per binary
# against 0.24 s for the same bytes in an ordinary directory, and 15 minutes
# across the 42 test binaries whose tests themselves take 5.5 s in total.
#
# `packed` runs `dsymutil` at link time and leaves no loose objects, so the
# directory stays the size of the build rather than the size of its history.
# `line-tables-only` is what keeps that cheap: a panic still reports
# `file:line`, which is what a failing test needs, and the DWARF `dsymutil`
# has to copy is a fraction of the full thing. Set `debug = true` here for a
# debugger session that needs variables.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
