[project]
name = "aiwatcher-query-duckdb"
version = "0.1.0"
description = "The DuckDB query engine: a query is DuckDB's relational Python API, served on the six /query routes."
requires-python = ">=3.14"
license = "Apache-2.0"
# DuckDB at the line the benchmark measured — 227 MiB peak over the 5 GB corpus as
# Parquet, 677 MiB as CSV — and nothing else: everything around the engine is the
# contract's.
dependencies = ["aiwatcher-query", "duckdb>=1.5,<1.6"]

[tool.uv.sources]
aiwatcher-query = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["query_duckdb"]
