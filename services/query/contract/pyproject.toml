[project]
name = "aiwatcher-query"
version = "0.1.0"
description = "The contract every Python query engine serves: the six /query routes, the declared catalog, the aiwatcher API paged into Arrow, and the child a query runs in."
requires-python = ">=3.14"
license = "Apache-2.0"
# The notebook runtime's server stack, at the lines it locks: starlette and
# uvicorn for the six routes, structlog for fields rather than sentences. httpx
# reads the aiwatcher API — synchronously in the child, where a query is plain
# code, and asynchronously for healthz. pyarrow is the one format every engine
# takes rows in and gives them back as, at the line the benchmark measured.
dependencies = [
  "httpx>=0.28,<0.29",
  "pyarrow>=25,<26",
  "starlette>=1.6,<2",
  "structlog>=25.4,<26",
  "uvicorn>=0.52,<0.53",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiwatcher_query"]
