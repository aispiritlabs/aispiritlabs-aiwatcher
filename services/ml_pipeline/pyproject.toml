[project]
name = "aiwatcher-ml-pipeline"
version = "0.1.0"
description = "The ML pipeline runtime for aiwatcher's curation blocks: one marimo notebook, served live and run as a step."
readme = "README.md"
# 3.14. This service is started by `just`, runs on one machine and is
# installed by `uv`, which fetches the interpreter — none of the constraints
# that keep `sdk/python` on a 3.11 floor apply here, and the floor there is a
# promise to whoever imports the SDK rather than a preference.
requires-python = ">=3.14"
license = "Apache-2.0"
# marimo brings the server with it: it already requires starlette and uvicorn,
# so the control routes and the app host cost nothing beyond the notebook
# runtime itself. Pinned to a minor line rather than exactly — `create_asgi_app`
# is marimo's public embedding API and a patch release of it is not a decision —
# with an upper bound because the thing depended on is a frontend runtime, not a
# function signature.
#
# The other two are what every row and every log line goes through. `orjson`
# because a staged file is the hot path here — a block's rows are written once
# and read twice per run, and the stdlib encoder is the slowest thing in that
# loop. `structlog` because this service's output is read while something is
# wrong with a notebook, and "which notebook, how many rows, how long" as
# fields beats the same words inside a sentence.
dependencies = [
  "marimo>=0.24,<0.25",
  "orjson>=3.11,<4",
  "structlog>=25.4,<26",
  "scikit-learn>=1.8,<1.9",
  "matplotlib>=3.10,<4",
  "pandas>=2.2,<4",
]

[project.scripts]
aiwatcher-ml-pipeline = "ml_pipeline.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml_pipeline", "flowai"]

[dependency-groups]
# httpx is here for starlette's TestClient, which is how the control routes are
# tested without a port.
dev = [
  "httpx>=0.28,<0.29",
  "mypy>=1.18,<2",
  "pandas-stubs>=2.2,<4",
  "pytest>=8.4,<9",
  "ruff>=0.16.5,<0.17",
]

[tool.uv]
required-version = ">=0.12.7,<0.13"

[tool.ruff]
target-version = "py314"
line-length = 100
# The demo notebooks are marimo files: every cell is a decorated function whose
# arguments are the other cells' names, so they read as unused imports and
# shadowed builtins to a linter that does not know the format. They are checked
# by being *run* — `tests/test_notebooks.py` executes each one against a fixture
# — which is the check that would actually catch a broken one.
extend-exclude = ["notebooks", ".revisions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "PTH", "BLE", "N", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S104"]

[tool.mypy]
python_version = "3.14"
strict = true
# The service and its tests, and deliberately not `notebooks`: a marimo cell
# is a function whose parameters are other cells' variables, generated by the
# editor, and annotating them would be annotating a file format. What checks a
# notebook is `tests/test_runner.py` running it over fixture rows.
files = ["ml_pipeline", "flowai", "tests"]

[[tool.mypy.overrides]]
module = ["marimo.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
