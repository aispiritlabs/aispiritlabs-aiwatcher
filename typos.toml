[files]
extend-exclude = [
  "*.lock",
  "package-lock.json",
  "target/",
  "node_modules/",
  # Build output and generated clients: not ours to spell-check, and the
  # minified bundle is full of two-letter identifiers the dictionary dislikes.
  "dist/",
  "apps/panel/src/api/generated/",
  ".data/",
  # Rendered diagrams. Each one inlines the Google Fonts stylesheet, whose
  # `unicode-range: U+0100-02BA` reads as a misspelling of `BY`. There is
  # nothing to correct: the renderer writes these files, so a fix here is
  # reverted by the next `just diagrams`.
  "docs/diagrams/out/",
  # Composer dependencies for services/query/flow, same reasoning as node_modules.
  "vendor/",
  # A base64url modulus and a PEM key. Base64 of anything eventually contains
  # four letters that spell something the dictionary has an opinion about.
  "crates/aiwatcher-auth/tests/fixtures/",
  # Written in Polish. Every finding here is a real word the English dictionary
  # reads as a near-miss for another one — `proces`, `tekst`, `minut`, `daty` —
  # so there is nothing to correct and no per-word entry that would help. A
  # review document written in English is checked like everything else; this
  # exclusion is by file, so the next one is a deliberate decision rather than
  # an inherited exemption.
  "docs/PIPELINE_REVIEW_2026-09-08.md",
  # The same decision, made again rather than inherited: the SDK review is also
  # written in Polish, and `proces` is the word it means.
  "docs/PYTHON_SDK_REVIEW_2026-09-08.md",
  # And again, for the walkthrough a reader follows in Polish while clicking
  # through the example. `blok`, `nowe` and `serwer` are the words it means;
  # the dictionary reads each as a near-miss for an English one. By directory
  # rather than by file, because a walkthrough is written as a set.
  "examples/titanic/",
  # The FTI design and acceptance documents are also written in Polish.
  "docs/FTI_KICKOFF.md",
  # Listed rather than globbed as `docs/FTI_*`, for the reason above: the
  # kickoff for B2 is Polish like its predecessor, and the next FTI document
  # should be a decision rather than an inherited exemption.
  "docs/FTI_KICKOFF_B2.md",
  "docs/FTI_IMPLEMENTATION_PLAN.md",
  "docs/FTI_ARCHITECTURE_REVIEW.md",
  "docs/FTI_FEATURE_CATALOG.md",
  "docs/FTI_FEATURE_GAPS.md",
  "docs/FTI_LANGFUSE_MLFLOW_ANALYSIS.md",
  "docs/FTI_UX_WANDB_PLAN.md",
]

[default.extend-words]
# OTLP / OpenTelemetry vocabulary the dictionary trips on.
Ser = "Ser"
# Stems, not typos. `PipelineStage::guess` matches a launch plan's name by
# substring, so "prepar" has to catch prepare, prepared and preparation — and
# a stem is a word with its ending cut off, which is precisely what a spell
# checker is built to complain about.
prepar = "prepar"
validat = "validat"
generat = "generat"
annotat = "annotat"
# A deliberate misspelling: the test that proves an input the entity does not
# declare is refused rather than dropped is about somebody typing this.
windwo = "windwo"
agnets = "agnets"
